name: CI

# PHASE 1 -- ENFORCING.
#
# Every job here blocks the merge. Each one ran in reporting mode first (Phase
# 0 for the six scanners, an earlier commit on this branch for the coverage
# ratchet) so its clean baseline was established before it could fail anything.
#
# These job names are referenced by the branch ruleset on main as required
# status checks. Renaming a job silently detaches its gate: the ruleset then
# waits for a check that no longer reports. Rename here and in the ruleset
# together, or not at all.
#
# Baselines are recorded in docs/PROGRESS.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny by default at the workflow level; every job re-grants only what it needs.
# Never rely on the ambient GITHUB_TOKEN scope.
permissions: {}

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci only. It installs strictly from the lockfile and fails if
      # package.json and the lockfile disagree; npm install would silently
      # resolve new versions inside the build.
      - name: Install dependencies
        run: npm ci

      # Proves .npmrc actually took effect on the runner rather than only on a
      # developer's machine. A control we have not watched work is not a control.
      - name: Verify install scripts are disabled
        run: |
          actual="$(npm config get ignore-scripts)"
          echo "npm config ignore-scripts = ${actual}"
          if [ "${actual}" != "true" ]; then
            echo "::error::ignore-scripts is '${actual}', expected 'true'"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundle
        run: npm run build

      - name: Report bundle size
        run: |
          bytes="$(wc -c < dist/main.js)"
          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| dist/main.js | ${bytes} bytes |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: dist/main.js
          retention-days: 7

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --ci

      - name: Report test and coverage baseline
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };
          const summary = read("coverage/coverage-summary.json");
          console.log("### Unit tests\n");
          if (!summary) { console.log("Coverage summary not produced."); process.exit(0); }
          const t = summary.total;
          console.log("| Metric | % | Covered / Total |");
          console.log("| --- | --- | --- |");
          for (const key of ["statements", "branches", "functions", "lines"]) {
            const m = t[key];
            console.log(`| ${key} | ${m.pct}% | ${m.covered} / ${m.total} |`);
          }
          NODE

      # Runs even when the tests failed: the ratchet's own failure mode on a
      # missing coverage summary is a deliberate signal, not noise.
      - name: Coverage ratchet
        if: always()
        run: npm run coverage:check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Human-readable to the log, JSON to a file for the report step. Without
      # the tee, a failing lint gate prints nothing at all and the developer
      # has to reproduce it locally to find out what broke.
      - name: Run ESLint
        run: |
          set -o pipefail
          npx eslint . --format json --output-file eslint-report.json 2>&1 | tee eslint-stderr.log || {
            echo "--- findings ---"
            npx eslint . --format stylish || true
            exit 1
          }

      - name: Report lint findings
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          let results = [];
          try { results = JSON.parse(fs.readFileSync("eslint-report.json", "utf8")); } catch {}
          const errors = results.reduce((n, f) => n + f.errorCount, 0);
          const warnings = results.reduce((n, f) => n + f.warningCount, 0);
          console.log("### ESLint\n");
          console.log("| Severity | Count |");
          console.log("| --- | --- |");
          console.log(`| errors | ${errors} |`);
          console.log(`| warnings | ${warnings} |`);
          if (errors + warnings > 0) {
            console.log("\n| File | Line | Rule | Message |");
            console.log("| --- | --- | --- | --- |");
            for (const file of results) {
              const rel = file.filePath.replace(process.cwd() + "/", "");
              for (const m of file.messages) {
                console.log(`| ${rel} | ${m.line} | \`${m.ruleId ?? "-"}\` | ${m.message} |`);
              }
            }
          }
          NODE

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        # Version pinned. Phase 2 moves this into the hermetic build image.
        run: pip install --disable-pip-version-check semgrep==1.175.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off \
            --json --output semgrep.json \
            --error

      - name: Report Semgrep findings
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          let report = { results: [], errors: [] };
          try { report = JSON.parse(fs.readFileSync("semgrep.json", "utf8")); } catch {}
          const bySeverity = {};
          for (const r of report.results ?? []) {
            const sev = r.extra?.severity ?? "UNKNOWN";
            bySeverity[sev] = (bySeverity[sev] ?? 0) + 1;
          }
          console.log("### Semgrep\n");
          console.log(`Total findings: **${(report.results ?? []).length}**\n`);
          console.log("| Severity | Count |");
          console.log("| --- | --- |");
          for (const [sev, n] of Object.entries(bySeverity)) console.log(`| ${sev} | ${n} |`);
          if (!Object.keys(bySeverity).length) console.log("| (none) | 0 |");
          NODE

  osv:
    name: OSV-Scanner (SCA)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed from a pinned release and checksum-verified, not via
      # google/osv-scanner-action. That action resolves to
      # `docker://ghcr.io/google/osv-scanner-action:v2.2.4` -- a mutable tag --
      # so SHA-pinning the action would pin the wrapper while leaving the thing
      # that actually executes floating. Its own description also says it is
      # not intended for direct use. See ADR-0005.
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: "2.5.1"
          OSV_SHA256: "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -sSfL "$url" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run OSV-Scanner
        run: |
          osv-scanner scan source \
            --lockfile=package-lock.json \
            --format=json \
            --output-file=osv.json

      - name: Report OSV findings
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          let report = { results: [] };
          try { report = JSON.parse(fs.readFileSync("osv.json", "utf8")); } catch {}
          let packages = 0, vulns = 0;
          for (const result of report.results ?? []) {
            for (const p of result.packages ?? []) {
              if ((p.vulnerabilities ?? []).length) packages += 1;
              vulns += (p.vulnerabilities ?? []).length;
            }
          }
          console.log("### OSV-Scanner\n");
          console.log("| Metric | Count |");
          console.log("| --- | --- |");
          console.log(`| vulnerable packages | ${packages} |`);
          console.log(`| advisories | ${vulns} |`);
          NODE

  commit-signing:
    name: Commit signing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # PR events only. A squash or merge commit created by GitHub's UI is signed
    # by GitHub's own key, not by gitsign, so verifying on push to main would
    # fail on every merge. base..head is exactly the human-authored commits.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitsign
        env:
          GITSIGN_VERSION: "0.17.1"
          GITSIGN_SHA256: "69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae"
        run: |
          set -euo pipefail
          url="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -sSfL "$url" -o gitsign
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          sudo install -m 0755 gitsign /usr/local/bin/gitsign
          gitsign --version || true

      # REPORTING MODE -- this gate is new and no commit is signed yet, so it
      # would fail everything. Two unknowns get resolved by watching it run:
      # whether the identity assertion works at all, and which OIDC issuer the
      # certificate actually carries (it depends on the provider chosen at the
      # browser prompt, so it cannot be predicted from here).
      #
      # `gitsign verify` is used rather than `git verify-commit` deliberately.
      # Per gitsign's own docs, the git commands verify cryptographic integrity
      # and Rekor presence but pass through no expected identity -- they cannot
      # tell you *who* signed. Asserting identity is the entire point.
      - name: Verify commit signatures
        # PHASE-1-SIGNING-GATE: delete this line to make unsigned commits block.
        continue-on-error: true
        env:
          EXPECT_IDENTITY: "besotware@gmail.com"
          # Pinned once observed. Until then the report prints what it finds.
          EXPECT_ISSUER: "https://github.com/login/oauth"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          commits="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"

          if [ -z "$commits" ]; then
            echo "No commits in range; nothing to verify."
            exit 0
          fi

          echo "### Commit signing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Expecting identity \`${EXPECT_IDENTITY}\` from issuer \`${EXPECT_ISSUER}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | Subject | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for sha in $commits; do
            subject="$(git log -1 --format=%s "$sha" | cut -c1-60)"
            echo "::group::verify ${sha}"
            if out="$(gitsign verify \
                  --certificate-identity="${EXPECT_IDENTITY}" \
                  --certificate-oidc-issuer="${EXPECT_ISSUER}" \
                  "$sha" 2>&1)"; then
              echo "$out"
              result="verified"
            else
              echo "$out"
              # Surface whatever identity the certificate does carry, so the
              # issuer can be pinned from evidence rather than guessed.
              result="FAILED: $(echo "$out" | tr '\n' ' ' | cut -c1-120)"
              failed=1
            fi
            echo "::endgroup::"
            echo "| \`${sha:0:8}\` | ${subject} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$failed"

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Secret scanning needs the whole history: a secret committed and later
      # removed is still a leaked secret, and a shallow clone hides it.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installed from a pinned release and checksum-verified rather than via a
      # third-party action, so the binary we execute is one we can name.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Two scans, because they answer different questions. `git` walks every
      # commit that has ever existed; `dir` inspects the working tree as it
      # stands, catching a secret that is present but never committed.
      - name: Scan full history
        run: gitleaks git --redact --report-format json --report-path gitleaks-history.json --exit-code 1 .

      - name: Scan working tree
        run: gitleaks dir --redact --report-format json --report-path gitleaks-tree.json --exit-code 1 .

      - name: Report gitleaks findings
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const count = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")).length; } catch { return 0; } };
          console.log("### gitleaks\n");
          console.log("| Scan | Findings |");
          console.log("| --- | --- |");
          console.log(`| full history | ${count("gitleaks-history.json")} |`);
          console.log(`| working tree | ${count("gitleaks-tree.json")} |`);
          NODE
